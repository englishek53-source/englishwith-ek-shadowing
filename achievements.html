<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievements - EnglishWith_EK</title>
  <style>
    :root {
      --bg: #F8F6F2;
      --text: #2B241F;
      --muted: #6d6d6d;
      --card-bg: #ffffff;
      --accent: #7D8E74;
      --accent-light: rgba(125, 142, 116, 0.12);
      --border: #E1DACB;
      --shadow: rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .back-btn {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      transition: background 0.2s;
    }

    .back-btn:hover {
      background-color: var(--accent-light);
    }

    .user-box {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 500;
    }

    /* Page Title */
    .title-section {
      text-align: center;
      margin-bottom: 28px;
    }

    .title-section h1 {
      font-size: 1.8rem;
      color: var(--text);
      margin-bottom: 6px;
    }

    .title-section p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* Achievements Grid */
    .achievements-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .badge-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 10px var(--shadow);
      transition: all 0.3s ease;
    }

    .badge-icon {
      font-size: 2.5rem;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      border-radius: 50%;
    }

    .badge-info {
      flex: 1;
    }

    .badge-info h3 {
      font-size: 1.1rem;
      margin-bottom: 4px;
      color: var(--text);
    }

    .badge-info p {
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* Locked State */
    .badge-card.locked {
      opacity: 0.5;
      filter: grayscale(100%);
    }

    /* Unlocked State */
    .badge-card.unlocked {
      opacity: 1;
      filter: grayscale(0%);
      border-color: var(--accent);
      background-color: var(--card-bg);
    }

    .badge-card.unlocked .badge-icon {
      background-color: var(--accent-light);
    }

    .status-tag {
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .badge-card.locked .status-tag {
      background-color: var(--border);
      color: var(--muted);
    }

    .badge-card.unlocked .status-tag {
      background-color: var(--accent);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <a href="index.html" class="back-btn">← Back to Lessons</a>
      <div id="userName" class="user-box">Guest</div>
    </header>

    <section class="title-section">
      <h1>🏆 Achievements</h1>
      <p>Track your shadowing progress and unlocked badges</p>
    </section>

    <div class="achievements-grid">

      <div class="badge-card locked" id="badge-first-lesson">
        <div class="badge-icon">🎯</div>
        <div class="badge-info">
          <h3>First Step</h3>
          <p>Complete your first shadowing lesson</p>
        </div>
        <span class="status-tag">Locked</span>
      </div>

      <div class="badge-card locked" id="badge-5-lessons">
        <div class="badge-icon">🔥</div>
        <div class="badge-info">
          <h3>On Fire</h3>
          <p>Complete 5 lessons successfully</p>
        </div>
        <span class="status-tag">Locked</span>
      </div>

      <div class="badge-card locked" id="badge-master">
        <div class="badge-icon">👑</div>
        <div class="badge-info">
          <h3>Shadowing Master</h3>
          <p>Complete all available lessons</p>
        </div>
        <span class="status-tag">Locked</span>
      </div>

    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCmj2ad7_3tQ7Xvt-UhnTg10NTxW3gCl30",
      authDomain: "englishwithek-fc6cd.firebaseapp.com",
      projectId: "englishwithek-fc6cd",
      storageBucket: "englishwithek-fc6cd.firebasestorage.app",
      messagingSenderId: "658796020424",
      appId: "1:658796020424:web:ff319ed8ed1730ea009bfd"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const userNameDisplay = document.getElementById("userName");

    // Check user authentication and update UI
    onAuthStateChanged(auth, (user) => {
      if (user) {
        userNameDisplay.textContent = user.displayName || "User";
      } else {
        userNameDisplay.textContent = "Guest";
      }
      loadAchievementsProgress();
    });

    // Update Badges UI based on stored progress
    function loadAchievementsProgress() {
      const completed = JSON.parse(localStorage.getItem("completedLessons") || "[]");
      const completedCount = completed.length;

      // Update Badge 1
      updateBadgeUI("badge-first-lesson", completedCount >= 1);

      // Update Badge 2
      updateBadgeUI("badge-5-lessons", completedCount >= 5);

      // Update Badge 3
      updateBadgeUI("badge-master", completedCount >= 10);
    }

    // Helper function to toggle badge classes and status label
    function updateBadgeUI(badgeId, isUnlocked) {
      const badge = document.getElementById(badgeId);
      if (!badge) return;

      const tag = badge.querySelector(".status-tag");

      if (isUnlocked) {
        badge.classList.remove("locked");
        badge.classList.add("unlocked");
        if (tag) tag.textContent = "Unlocked";
      } else {
        badge.classList.add("locked");
        badge.classList.remove("unlocked");
        if (tag) tag.textContent = "Locked";
      }
    }
  </script>

</body>
</html>
