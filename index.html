<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnglishWith_EK Shadowing</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#F8F6F2;
color:#2B241F;
}

header{
padding:25px;
text-align:center;
}

h1{
font-size:42px;
margin:10px;
}

p{
color:#6d6d6d;
}

button{
background:#7D8E74;
color:white;
border:none;
padding:15px 35px;
border-radius:50px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

.video{
width:90%;
max-width:900px;
height:350px;
background:white;
margin:auto;
border-radius:25px;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 10px 30px rgba(0,0,0,.08);
font-size:22px;
}

.cards{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
padding:40px;
}

.card{
background:white;
padding:25px;
border-radius:20px;
width:250px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
text-align:center;
}

</style>

</head>

<body>

<header>

<h1>EnglishWith_EK</h1>

<p>Listen • Repeat • Speak Naturally</p>

<button>Start Shadowing</button>

</header>

<div class="video">

🎥 Lesson Player

</div>

<div class="cards">

<div class="card">
<h2>Daily Conversation</h2>
<p>Practice everyday English.</p>
</div>

<div class="card">
<h2>Psychology</h2>
<p>Learn through powerful ideas.</p>
</div>

<div class="card">
<h2>Motivation</h2>
<p>Improve English while growing.</p>
</div>

</div>

</body>
</html>
